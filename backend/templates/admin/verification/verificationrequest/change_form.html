{% extends "admin/change_form.html" %}

{% block after_field_sets %}
  {{ block.super }}
  {% if original and can_review %}
    <fieldset class="module aligned">
      <h2>Thao tác xét duyệt</h2>
      <div class="form-row">
        <label for="id_review_action"><strong>Hành động</strong></label>
        <select id="id_review_action" name="review_action" required>
          <option value="">---------</option>
          {% for value, label in review_actions %}
            <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-row">
        <label for="id_reason_code"><strong>Mã lý do</strong></label>
        <input id="id_reason_code" name="reason_code" type="text" maxlength="64" placeholder="Ví dụ: blurry_document">
        <p class="help">Bắt buộc khi yêu cầu bổ sung, từ chối hoặc thu hồi.</p>
      </div>
      <div class="form-row">
        <label for="id_user_visible_reason"><strong>Phản hồi cho người dùng</strong></label>
        <textarea id="id_user_visible_reason" name="user_visible_reason" rows="4" placeholder="Nội dung người dùng sẽ nhìn thấy"></textarea>
      </div>
      <div class="form-row">
        <label for="id_internal_note"><strong>Ghi chú nội bộ</strong></label>
        <textarea id="id_internal_note" name="internal_note" rows="4" placeholder="Không hiển thị cho người dùng"></textarea>
      </div>
      <div class="submit-row">
        <button type="submit" class="button default" formaction="{{ review_action_url }}" formmethod="post">Thực hiện xét duyệt</button>
      </div>
    </fieldset>
  {% endif %}
{% endblock %}
