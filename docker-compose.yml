services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lovelink}
      POSTGRES_USER: ${POSTGRES_USER:-lovelink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lovelink}
    ports:
      - "127.0.0.1:${POSTGRES_EXPOSE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lovelink}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_EXPOSE_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin}; do sleep 2; done;
      mc mb --ignore-existing local/${S3_PROFILE_BUCKET:-profile-media};
      mc mb --ignore-existing local/${S3_VERIFICATION_BUCKET:-verification-evidence-private};
      mc anonymous set download local/${S3_PROFILE_BUCKET:-profile-media};
      exit 0;"

  backend:
    build: ./backend
    env_file: .env
    command: >
      sh -c "uv run --active --no-sync python manage.py migrate --noinput &&
      uv run --active --no-sync python manage.py seed_reference_data &&
      uv run --active --no-sync python manage.py collectstatic --noinput &&
      exec uv run --active --no-sync daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  celery:
    build: ./backend
    env_file: .env
    command: uv run --active --no-sync celery -A config worker -l INFO
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: ./backend
    env_file: .env
    command: uv run --active --no-sync celery -A config beat -l INFO
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:latest}
    command: --config /etc/livekit.yaml
    network_mode: host
    volumes:
      - ./infrastructure/livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/app}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules:
