name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt
      - name: Create backend environment with uv
        working-directory: backend
        run: |
          uv python install 3.13
          uv venv --python 3.13
          uv pip sync requirements.txt
      - name: Run backend checks and tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
        run: |
          uv run --no-sync python manage.py check
          uv run --no-sync python manage.py makemigrations --check --dry-run
          uv run --no-sync python manage.py migrate --noinput
          uv run --no-sync pytest
          uv run --no-sync python -m compileall -q .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start Next.js test server
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/lovelink-next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/lovelink-next.log
          exit 1
      - working-directory: frontend
        env:
          CI: "1"
        run: npm run test:e2e -- --project=chromium e2e/public.spec.ts

  fullstack-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Prepare environment
        run: |
          cp .env.example .env
          echo 'PHONE_OTP_FIXED_CODE=123456' >> .env
      - name: Start real application stack
        run: |
          docker compose up -d --build postgres redis minio minio-init backend frontend livekit
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8000/healthz >/dev/null \
              && curl -fsS http://localhost:3000 >/dev/null \
              && (echo > /dev/tcp/127.0.0.1/7880) 2>/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color backend frontend minio livekit
          exit 1
      - name: Seed deterministic E2E users and workflows
        run: docker compose exec -T backend python manage.py seed_e2e
      - name: Verify PostgreSQL backup and restore
        run: |
          docker compose exec -T postgres pg_dump -U lovelink -d lovelink -Fc > /tmp/lovelink.dump
          docker compose exec -T postgres createdb -U lovelink lovelink_restore_test
          docker compose exec -T postgres pg_restore -U lovelink -d lovelink_restore_test --no-owner < /tmp/lovelink.dump
          test "$(docker compose exec -T postgres psql -U lovelink -d lovelink_restore_test -tAc 'SELECT count(*) FROM accounts_user;')" -ge 3
          docker compose exec -T postgres dropdb -U lovelink lovelink_restore_test
      - name: Run browser tests against Django, PostgreSQL, Redis, WebSocket and LiveKit
        working-directory: frontend
        env:
          CI: "1"
          FULLSTACK_E2E: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npm run test:e2e -- --project=chromium e2e/fullstack.spec.ts
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color backend frontend postgres redis minio livekit
      - name: Stop stack
        if: always()
        run: docker compose down -v
