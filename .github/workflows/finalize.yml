name: Finalize LoveLink MVP

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Generate and verify Django migrations
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
        run: |
          python manage.py makemigrations --noinput
          python manage.py check
          python manage.py migrate --noinput
          pytest
          python -m compileall -q .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install and verify frontend
        working-directory: frontend
        run: |
          npm install
          npm run lint
          npm run build
      - name: Commit generated artifacts
        run: |
          rm -f .github/workflows/finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: add migrations and lock dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi
