name: Generate Django migrations

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".migration-trigger"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Generate and verify migrations
        env:
          DATABASE_URL: sqlite:////tmp/lovelink-migrations.sqlite3
          REDIS_URL: redis://localhost:6379/0
          CHANNEL_REDIS_URL: redis://localhost:6379/1
          CELERY_BROKER_URL: memory://
          CELERY_RESULT_BACKEND: cache+memory://
          DJANGO_SECRET_KEY: migration-only-secret
        run: |
          python backend/manage.py makemigrations
          python backend/manage.py makemigrations --check --dry-run
      - name: Commit migrations and remove temporary workflow
        run: |
          rm -f .migration-trigger .github/workflows/generate-migrations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: commit initial Django migrations"
          git push origin HEAD:${{ github.head_ref }}
