name: Recover LoveLink source

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Produce recovery diagnostics
        run: python .bootstrap/apply_payload.py
      - uses: actions/upload-artifact@v4
        with:
          name: lovelink-recovery-diagnostics
          path: /tmp/lovelink-recovery
          retention-days: 7
